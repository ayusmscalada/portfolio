<!doctype html>
<html lang="en" data-theme="dark" data-accent="signal" data-motion="full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%PROFILE_TITLE%</title>
    <meta name="description" content="%PROFILE_DESCRIPTION%" />
    <meta name="author" content="%PROFILE_NAME%" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%PROFILE_TITLE%" />
    <meta property="og:description" content="%PROFILE_DESCRIPTION%" />
    <meta name="theme-color" content="#050a14" />
    <link rel="icon" type="image/svg+xml" href="%PROFILE_FAVICON%" />
    <script>
      // Start loading site content from the backend right away, in parallel
      // with the JS bundle. main.jsx awaits it.
      ;(function () {
        if (location.search.indexOf('preview') !== -1) return
        window.__content = fetch('%API_URL%'.replace(/\/+$/, '') + '/api/content')
          .then(function (r) { return r.ok ? r.json() : null })
          .then(function (d) { return (d && d.content) || null })
          .catch(function () { return null })
      })()
    </script>
    <script>
      // Apply saved theme/accent before first paint (no flash).
      ;(function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('theme')
          if (!theme) theme = 'dark'
          root.dataset.theme = theme
          root.dataset.motion = localStorage.getItem('motion') || 'full'
          var accent = localStorage.getItem('accent')
          if (accent) root.dataset.accent = accent
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
